# SecurAI local/full stack (Phase 1 MVP).
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Default: API + PostgreSQL with the echo (mock) provider, so it runs anywhere.
# To use a real model, enable the `gpu` profile (requires NVIDIA runtime) and
# point the API at the vLLM service.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securai
      POSTGRES_PASSWORD: securai
      POSTGRES_DB: securai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECURAI_ENVIRONMENT: local
      SECURAI_DATABASE_URL: postgresql+asyncpg://securai:securai@postgres:5432/securai
      SECURAI_JWT_SECRET: change-me-to-a-long-random-secret-min-32-chars
      SECURAI_DEFAULT_PROVIDER: echo
      SECURAI_DEFAULT_MODEL: securai-echo-1
      # To use vLLM (with the gpu profile):
      # SECURAI_DEFAULT_PROVIDER: openai_compatible
      # SECURAI_DEFAULT_MODEL: meta-llama/Llama-3.1-8B-Instruct
      # SECURAI_PROVIDER_BASE_URL: http://vllm:8000/v1
    ports:
      - "8000:8000"

  # Optional self-hosted inference (enable with: --profile gpu)
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: ["--model", "meta-llama/Llama-3.1-8B-Instruct"]
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  pgdata:
