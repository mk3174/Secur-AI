[project]
name = "securai-api"
version = "0.1.0"
description = "SecurAI control plane API - Phase 1 MVP (secure AI gateway)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/JS template: long lines are expected.
"src/securai/interfaces/dashboard.py" = ["E501"]
# Tests favour explicit nested context managers and inline literals.
"tests/**" = ["SIM117", "C408", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
